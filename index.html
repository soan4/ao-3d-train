body:not(.free):not(.driving) #tools{display:grid!important;grid-template-columns:repeat(6,minmax(0,1fr));max-width:354px;margin:auto;gap:5px;max-height:none;overflow:visible;}

body:not(.free) #tools button::before{width:36px;height:36px;}
body:not(.free) #tools button[data-tool="station"],body:not(.free) #tools button[data-tool="river"],body:not(.free) #tools button[data-tool="road"],body:not(.free) #tools button[data-tool="meadow"],body:not(.free) #tools button[data-tool="house"]{display:none!important}
body.driving #tools{display:none!important}
#run.route-ready{outline:3px solid #70bd52;outline-offset:2px}#run.course-clear{outline:3px solid #f7b93b;outline-offset:2px}body #run.course-clear::before{background-image:none;content:"▶";font-size:31px;color:#6a441b;font-weight:900;display:grid;place-items:center}
#missionBanner.show{font-size:clamp(14px,4vw,18px);max-width:72vw;white-space:normal;pointer-events:none;}
#deliveryDots{display:none;position:fixed;top:calc(env(safe-area-inset-top) + 50px);left:50%;transform:translateX(-50%);z-index:5;padding:3px 8px;background:#fff2d9e8;border:1px solid #d4ac76;border-radius:12px;gap:5px;pointer-events:none;font-size:18px;line-height:1.1;}
body.driving:not(.free) #deliveryDots{display:flex;top:calc(env(safe-area-inset-top) + 83px)}#deliveryDots span.done{opacity:.32;filter:grayscale(1)}

/* v3.1: interactive delivery tray replaces the throttle while stopped. */
#transferPanel[hidden]{display:none!important}
#transferPanel{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 7px);left:8px;right:8px;max-width:350px;margin:auto;z-index:11;display:flex;align-items:center;justify-content:center;gap:5px;padding:5px;background:var(--wood);border:1px solid #c89d65;border-radius:16px;box-shadow:0 3px 0 #b98b52;}
body.transferring #drivePanel{display:none!important}body.transferring #viewToggle{display:none!important}
body.transferring #deliveryDots{top:calc(env(safe-area-inset-top) + 35px)}
#transferPanel button{min-width:44px;min-height:48px;height:48px;width:50px;padding:2px!important;flex:0 1 58px;}
#transferPanel button::before{width:35px;height:35px;}
#transferPanel button:disabled{opacity:.5;box-shadow:none;}
#transferPanel .transfer-next{flex:1 1 75px;background:linear-gradient(145deg,#e7f5b9,#8fc86e);border-color:#739e49;}
#transferPanel .transfer-done{opacity:.35;filter:grayscale(.9);}
#transferPanel .transfer-direction{width:39px;flex:0 0 39px;height:44px;display:grid;place-items:center;}
#transferPanel .transfer-direction svg{width:37px;height:37px;}
#transferPanel .transfer-back{flex:0 0 44px;min-width:44px;width:44px;}
#transferPanel .transfer-back::before{width:28px;height:28px;}
#deliveryDots span{width:23px;height:23px;background-size:contain;background-repeat:no-repeat;background-position:center;display:block;font-size:0;}
#deliveryDots span.waiting{opacity:.28;filter:grayscale(1)}#deliveryDots span.done{opacity:.25;filter:grayscale(1)}

/* v3.1.1: direct manipulation of the real 3D delivery toys. */
body.transferring #cameraControls{display:none!important}
#transferPanel{width:max-content;max-width:calc(100vw - 16px);left:auto;right:10px;margin:0;background:transparent;border:0;box-shadow:none;padding:0;gap:7px}
#transferPanel .transfer-next{width:100px;flex:0 0 100px}
#transferTargets{position:fixed;inset:0;z-index:8;pointer-events:none;overflow:hidden}
#transferTargets[hidden]{display:none!important}
#transferTargets .toy-touch{position:absolute;width:58px;height:58px;min-width:0;min-height:0;padding:0!important;border:2px solid #ffed9a;outline:2px solid #ab7139aa;background:transparent;box-shadow:0 0 13px #fff1a777;border-radius:50%;transform:translate(-50%,-50%);pointer-events:auto;touch-action:none;animation:toy-pulse 1.1s ease-in-out infinite;}
#transferTargets .toy-touch::before{display:none!important}
#transferTargets .toy-touch:active{background:#ffec8833;animation:none}
#transferTargets .toy-destination{position:absolute;width:52px;height:52px;border:3px dashed #fff4ab;box-shadow:0 0 12px #ffe274;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;opacity:.92}
#transferTargets .toy-star{position:absolute;pointer-events:none;color:#ffdf65;font-size:24px;text-shadow:0 1px 2px #7a4b24;transform:translate(-50%,-50%);animation:toy-burst .68s ease-out both}
@keyframes toy-pulse{50%{border-color:#fff;box-shadow:0 0 16px #fff0a7b0}}
@keyframes toy-burst{from{opacity:1;transform:translate(-50%,-50%) scale(.6)}to{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(35deg) scale(1.15)}}
@media(prefers-reduced-motion:reduce){#transferTargets .toy-touch{animation:none}}

/* v3.1.5: optional controls in one normally closed wooden drawer. */

function findFreeRoute(prefix=[]){
 const start=freeTracks.get(startKey),goal=freeTracks.get(goalKey);if(!start||!goal||!freeCon(start).includes(2))return null;
 const required=gameMode==='puzzle'?[...requiredStations]:[];const all=(1<<required.length)-1;
 const queue=[{k:startKey,entry:2,steps:[],mask:0}],visited=new Set([startKey+':2:0']);
 for(let qi=0;qi<queue.length;qi++){
  const state=queue[qi],t=freeTracks.get(state.k);if(!t||!freeCon(t).includes(state.entry))continue;const forced=prefix[state.steps.length];if(forced&&(forced.k!==state.k||forced.entry!==state.entry))continue;const i=required.indexOf(state.k),mask=i<0?state.mask:state.mask|(1<<i);
  if(state.k===goalKey){if(state.steps.length>=prefix.length&&state.entry===3&&mask===all)return [...state.steps,{k:state.k,entry:state.entry,exit:1}];continue;}
  for(const out of freeCon(t).filter(d=>d!==state.entry&&(!forced||forced.exit===d))){
   const [dx,dy]=dir[out],nk=key(t.x+dx,t.y+dy),nt=freeTracks.get(nk),incoming=opposite(out);
   if(!nt||!freeCon(nt).includes(incoming)||nk===startKey)continue;
   const stateKey=nk+':'+incoming+':'+mask+':'+Math.min(prefix.length,state.steps.length+1);if(visited.has(stateKey))continue;visited.add(stateKey);
   queue.push({k:nk,entry:incoming,mask,steps:[...state.steps,{k:state.k,entry:state.entry,exit:out}]});
  }
 }return null;
}
function installFreeRoute(steps,freshSignals=false){
 const points=[],stationPos=pos(0,2),switchEntries=[],stepBounds=[];branchPlan=steps;
 // The approach rail extends south from the start tile.
 points.push(stationPos.clone().addScaledVector(vecDir(2),3.8));
 for(const [index,st] of steps.entries()){
  const t=freeTracks.get(st.k),center=pos(t.x,t.y);
  let local;
  if(st.k===goalKey){local=[edge(st.entry),new THREE.Vector3(0,0,0)];}
  else{local=tileRailPoints([st.entry,st.exit]);}
  let firstIndex;for(const [j,lp] of local.entries()){
   const point=center.clone().add(lp);point.y=0;
   if(!points.length||points.at(-1).distanceTo(point)>.002)points.push(point);
   if(j===0)firstIndex=points.length-1;
   if(j===0&&t.shape==='branch'&&st.entry===t.step) switchEntries.push({index,k:st.k,pointIndex:points.length-1});
  }
  stepBounds.push({first:firstIndex,last:points.length-1});
 }
 const finish=points.at(-1).clone();
 // A small terminus extension accommodates the head of the train.
 points.push(finish.clone().addScaledVector(vecDir(1),.25));
 routePoints=points;rebuildDistances();
 startDistance=3.8;finishDistance=routeLengths[routeLengths.length-2];
 branchStops=switchEntries.map(b=>({...b,s:Math.max(startDistance,routeLengths[b.pointIndex]-.72)}));
 buildRailSignals(steps,freshSignals);
 if((!passingPlan||passingPlan.phase==='ready')&&followingHead===null)passingPlan=findPassingPlan(steps,stepBounds);
}

// Coordinate the exit turnout of an existing passing loop when the driver chooses its other track.
function branchRouteChoice(stop,choice,previous){
 const t=freeTracks.get(stop.k),st=previous[stop.index],changes=new Map();
 const change=(tile,value)=>{if(!changes.has(tile))changes.set(tile,tile.switchChoice);tile.switchChoice=value;};
 const restore=()=>{for(const [tile,value] of changes)tile.switchChoice=value;};
 const old=t.switchChoice;
 let alternate=null;
 if(choice!==old){for(let j=stop.index+3;j<previous.length-1;j++){const candidate=passingAlternate(previous,stop.index,j);if(candidate&&candidate.nc===choice){alternate=candidate;break;}}}
 change(t,choice);
 if(alternate)change(alternate.far,alternate.fc);
 const prefix=[...previous.slice(0,stop.index),{...st,exit:branchEnds(t)[1]}];
 const next=findFreeRoute(prefix);
 if(!next){restore();return null;}
 return {next,changes,restore};
}

// Ver.3.6: one reserved, physically separate passing loop per run.
// The opposing train uses the reverse of a real connected path, never a teleport through a turnout.
function passingAlternate(steps,i,j){
 const near=freeTracks.get(steps[i].k),far=freeTracks.get(steps[j].k);
 if(!near||!far||near.shape!=='branch'||far.shape!=='branch'||steps[i].entry!==near.step||steps[j].exit!==far.step)return null;
 const nc=near.switchChoice===1?0:1,fc=far.switchChoice===1?0:1;
 const first=branchArm(near,nc),last=branchArm(far,fc),blocked=new Set(steps.map(s=>s.k));
 const neighbor=(tile,d)=>key(tile.x+dir[d][0],tile.y+dir[d][1]);
 let k=neighbor(near,first),entry=opposite(first),middle=[],visited=new Set();
 while(k!==steps[j].k){
  const t=freeTracks.get(k);if(!t||blocked.has(k)||visited.has(k)||t.shape==='branch')return null;
  const ends=freeCon(t);if(ends.length!==2||!ends.includes(entry))return null;
  visited.add(k);const exit=ends.find(d=>d!==entry);middle.push({k,entry,exit});k=neighbor(t,exit);entry=opposite(exit);
 }
 if(entry!==last||middle.length<2)return null;
 return {steps:[{...steps[i],exit:first},...middle,{...steps[j],entry:last}],nc,fc,near,far};
}
function passingLine(points){const lengths=[0];for(let i=1;i<points.length;i++)lengths.push(lengths.at(-1)+points[i].distanceTo(points[i-1]));return {points,lengths,total:lengths.at(-1)};}
function passingRaw(line,d){const s=Math.max(0,Math.min(line.total,d));let lo=0,hi=line.lengths.length-1;while(lo+1<hi){const m=(lo+hi)>>1;if(line.lengths[m]<=s)lo=m;else hi=m;}return line.points[lo].clone().lerp(line.points[hi],(s-line.lengths[lo])/(line.lengths[hi]-line.lengths[lo]));}
function passingSample(line,d){const p=passingRaw(line,d),v=passingRaw(line,d+.12).sub(passingRaw(line,d-.12));return {position:p,heading:Math.atan2(v.x,v.z)};}
function clearBetween(a,b,limit=1.58){return a.every(p=>b.every(q=>Math.hypot(p.x-q.x,p.z-q.z)>=limit));}
function findPassingPlan(steps,bounds){
 if(new Set(steps.map(s=>s.k)).size!==steps.length)return null;
 const span=2*carSpacing,leadNow=startDistance+distanceTravelled;
 for(let i=1;i<steps.length-2;i++)for(let j=i+3;j<steps.length-1;j++){
  const alt=passingAlternate(steps,i,j);if(!alt)continue;
  const a=bounds[i].first,b=bounds[j].last;
  if(routeLengths[b]-routeLengths[a]<span+3.2||routeLengths[a]<span+1.2||finishDistance-routeLengths[b]<span+1.1)continue;
  const forward=routePoints.slice(0,a+1).map(p=>p.clone());
  const append=p=>{if(forward.at(-1).distanceTo(p)>.002)forward.push(p);};
  for(const st of alt.steps){const t=freeTracks.get(st.k);for(const q of tileRailPoints([st.entry,st.exit]))append(pos(t.x,t.y).add(q));}
  for(const p of routePoints.slice(b+1,-1))append(p.clone());
  const line=passingLine(forward.reverse());
  const start=span+.12,end=line.total-.20;
  if(end<start+span)return null;
  const swept=[];for(let d=0;d<=line.total;d+=.10)swept.push(passingRaw(line,d));swept.push(passingRaw(line,line.total));
  const parked=[0,1,2].map(n=>passingRaw(line,end-n*carSpacing));
  for(let hold=Math.max(routeLengths[a]+span+1.1,leadNow+.30);hold<=routeLengths[b]-1.1;hold+=.12){
   const body=[0,1,2].map(n=>sampleRoute(hold-n*carSpacing).position);
   if(!clearBetween(body,swept,1.60))continue;
   let safe=true;for(let d=hold-span;d<=finishDistance;d+=.12){if(!clearBetween([sampleRoute(d).position],parked,1.60)){safe=false;break;}}
   if(!safe)continue;
   return {alt,line,start,end,hold,phase:'ready',head:start,speed:0,nearOriginal:alt.near.switchChoice,farOriginal:alt.far.switchChoice,view:null};
  }
 }

}

  for(const {arm,side} of c.arms)arm.rotation.x=side*(1-c.closed)*Math.PI/2;
  c.lamps.forEach((lamp,i)=>lamp.material=(danger||c.closed>.02)&&((Math.floor(now/320)+i)%2===0)?signalRed:signalOff);
 }
}
function rebuildTraffic(){
 const nodes=new Map();
 const axis=(angle,base)=>Math.abs(Math.cos(angle+base))>.5?'x':'z';
 if(gameMode==='puzzle'){for(const [k,item] of challengeTerrain)if(item.type==='road'){const [x,y]=k.split(',').map(Number);nodes.set(k,{x,y,axis:'z'});}}
 else for(const [k,item] of freeDecor)if(item.type==='road'){const [x,y]=k.split(',').map(Number);nodes.set(k,{x,y,axis:axis(item.model.rotation.y,Math.PI/2)});}
 for(const c of crossings)if(crossingActive(c))nodes.set(key(c.x,c.y),{x:c.x,y:c.y,axis:axis(c.g.rotation.y,0),cross:c});
 const sig=gameMode+'|'+[...nodes].map(([k,n])=>k+':'+n.axis+':'+!!n.cross).sort().join('|');
 if(sig===trafficSignature)return;trafficSignature=sig;
 for(const car of trafficCars){trafficRoot.remove(car.g);car.g.traverse(o=>{if(o.geometry)o.geometry.dispose();});}trafficCars=[];
 const seen=new Set();
 for(const [k,n] of nodes){if(seen.has(k))continue;const dx=n.axis==='x'?1:0,dy=1-dx;
  let x=n.x,y=n.y;const matches=(a,b)=>nodes.get(key(a,b))?.axis===n.axis;
  while(matches(x-dx,y-dy)){x-=dx;y-=dy;}
  const cells=[];while(matches(x,y)){const cell=nodes.get(key(x,y));cells.push(cell);seen.add(key(x,y));x+=dx;y+=dy;}
  // A crossing needs road on both sides before vehicles can traverse it.
  let segment=[];const addSegment=()=>{
   if(!segment.length)return;
   const first=segment[0],last=segment.at(-1);if(first.cross||last.cross){segment=[];return;}
   const origin=pos(first.x,first.y),length=segment.length*1.65;
   const stops=segment.map((v,i)=>v.cross?{c:v.cross,s:i*1.65+.825}:null).filter(Boolean);
   for(const sign of [-1,1]){const g=makeRoadCar(trafficPaint[trafficCars.length%4]);g.rotation.y=dx?sign*Math.PI/2:(sign===1?0:Math.PI);trafficCars.push({g,origin,dx,dy,length,stops,sign,s:sign===1?.24:length-.24,lane:sign*.16});}
   segment=[];
  };
  for(let i=0;i<cells.length;i++){const cell=cells[i];if(cell.cross&&(i===0||i===cells.length-1)){addSegment();continue;}segment.push(cell);}addSegment();
 }
}
function updateTraffic(dt){
 rebuildTraffic();
 for(const car of trafficCars){
  const {g,origin,dx,dy,length,stops,sign,lane}=car;
  let next=car.s+sign*dt*1.05;
  for(const {c,s} of stops){if(!c.blocked&&c.closed<.02)continue;const line=s-sign*.98;
   if(sign*(car.s-line)<=.001&&sign*(next-line)>=0)next=line;
  }
  if(next>length-.23)next=.23;else if(next<.23)next=length-.23;
  // Avoid spawning a car on a closed crossing after wrapping.
  car.s=next;g.position.set(origin.x+dx*(next-.825)+dy*lane,0,origin.z+dy*(next-.825)-dx*lane);
 }
}
let prev=performance.now();function animate(now){
 requestAnimationFrame(animate);const dt=Math.min((now-prev)/1000,.05);prev=now;
 if(now-lastDaylightCheck>10000){lastDaylightCheck=now;updateDaylight();}
 if(bannerTime>0){bannerTime-=dt;if(bannerTime<=0)bannerEl.classList.remove('show')}

 if(playing){
  elapsed+=dt;
  if(transfer){currentSpeed=0;tickTransfer(dt);}
  else if(branchWait){currentSpeed=0;}
  else if(passingPlan?.phase==='waiting'||passingPlan?.phase==='moving'){currentSpeed=0;}
  else if(missionWait>0){
   // Station dwell must continue even when the driver leaves the lever at STOP.
   currentSpeed=0;
   missionWait=Math.max(0,missionWait-dt);boardingClock+=dt;updateBoarding(boardingClock);
   if(missionWait===0){missionLoaded=true;updateMissionVisual();hideBoarding();departureBell();progressEl.textContent='③ '+(missionType==='passenger'?'🧒 おきゃくさんを のせた！':'📦 にもつを つんだ！')+' ゴールへ！';msg.textContent='🚃 ドアが しまった！ しゅっぱつ！';}
  }else{
   let target=targetSpeeds[driveGear];
   const stationStop=missionNext<missionStops.length?missionStops[missionNext].s:null;
   const nextBranch=branchStops.find(b=>!branchPassed.has(b.index)&&b.s>=startDistance+distanceTravelled-.02);
   const atBranch=!!nextBranch&&(stationStop===null||nextBranch.s<stationStop);
   const ordinaryStop=atBranch?nextBranch.s:stationStop;
   const signal=nextRailSignal(startDistance+distanceTravelled,false);
   const atSignal=!!signal&&(ordinaryStop===null||signal.stopAt<ordinaryStop-.015);
   const regularStop=atSignal?signal.stopAt:ordinaryStop;
   const atPassing=passingPlan?.phase==='ready'&&(regularStop===null||passingPlan.hold<regularStop-.015);
   const nextStop=atPassing?passingPlan.hold:regularStop;
   if(nextStop!==null){
    const remaining=Math.max(0,nextStop-(startDistance+distanceTravelled));
    // Slow down automatically before the intermediate platform.
    target=Math.min(target,Math.sqrt(2*stationBraking*remaining));
   }
   currentSpeed=approachSpeed(currentSpeed,target,dt);
   if(currentSpeed<.015)currentSpeed=0;
   let advance=currentSpeed*dt;
   if(nextStop!==null){
    const remaining=Math.max(0,nextStop-(startDistance+distanceTravelled));
    if(remaining<=Math.max(.012,advance)){
     advance=remaining;distanceTravelled+=advance;currentSpeed=0;positionAllCars();if(atPassing)beginPassing();else if(atSignal)waitAtRailSignal(signal);else if(atBranch)beginBranchWait(nextBranch);else onStationStop();
    }else distanceTravelled+=advance;
   }else distanceTravelled+=advance;
   if(advance>0){for(const wheel of wheelSpinners)wheel.rotation.x-=advance/.135;positionAllCars();}
   if(startDistance+distanceTravelled>=finishDistance){
    distanceTravelled=finishDistance-startDistance;positionAllCars();
    hideBoarding();currentSpeed=0;if(gameMode==='puzzle'){const [x,y]=goalKey.split(',').map(Number);beginTransfer('goal',{x,y});}else{playing=false;setCabView(false);updateRunButton();msg.textContent='🎉 '+carCount+'りょう ぜんぶ とうちゃく！';onMissionFinish();}
   }
  }
  refreshSpeedDisplay();
 }
 tickPassing(dt);tickFollowing(dt);updateRailSignals();updateCrossings(now,dt);updateTraffic(dt);
 tickScenery(dt,now);
 updateCabCamera();
 renderer.render(scene,camera)
}requestAnimationFrame(animate);window.__aoLoaded=true;
</script></body></html>
