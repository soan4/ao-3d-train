 if(con.length===1){const d=con[0];return [new THREE.Vector3(0,0,0),edge(d).clone()];}
 const a=con[0],b=con[1];
 const eA=edge(a),eB=edge(b),uA=vecDir(a),uB=vecDir(b);

   const axle=new THREE.Mesh(new THREE.CylinderGeometry(.042,.042,.85,12),steel);

   for(const side of [-1,1]){
    // Rotating group is aligned with wheel axis (X in car coordinates).
    const spin=new THREE.Group();spin.position.set(side*.417,.24,axleZ);truck.add(spin);
    const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.135,.135,.085,20),rubber);
    wheel.rotation.z=Math.PI/2;wheel.castShadow=true;spin.add(wheel);
    const ring=new THREE.Mesh(new THREE.TorusGeometry(.088,.012,6,18),steel);
    ring.rotation.y=Math.PI/2;ring.position.x=side*.047;spin.add(ring);
    // Small eccentric marker makes wheel rotation visually evident.
    const marker=cube(spin,.018,.032,.040,cream,side*.061,.075,0);
    wheelSpinners.push(spin);
   }
  }
  // Central bolster/suspension.
  cube(truck,.42,.07,.17,steel,0,.345,0);
  bogies.push({group:truck,offset:pivotZ});
 }
 bogiesByCar[number]=bogies;
 // End marker and inter-car coupler on local -Z end.
 cube(car,.15,.055,.13,chassisMat,0,.30,-.70);
 // Small connecting diaphragms and a subtle side identification mark.
 cube(car,.51,.42,.025,glassTrim,0,.73,-.626);
 for(const x of [-.404,.404])cube(car,.018,.09,.16,cream,x,.55,-.04);
 return car;
}
for(let i=0;i<3;i++)trainCars.push(railTrainCar(i));
// Connections between adjacent cars, rebuilt in-place each animation frame.
const couplerMaterial=new THREE.MeshStandardMaterial({color:0x454e59,metalness:.42,roughness:.5});
const couplers=[];
for(let i=0;i<2;i++){
 const bar=new THREE.Mesh(new THREE.CylinderGeometry(.034,.034,1,10),couplerMaterial);
 bar.castShadow=true;scene.add(bar);couplers.push(bar);
}
const couplerAxis=new THREE.Vector3(0,1,0);
const tmpA=new THREE.Vector3(),tmpB=new THREE.Vector3();
function positionCouplers(){
 trainCars.forEach(c=>c.updateMatrixWorld(true));
 for(let i=0;i<couplers.length;i++){
  const link=couplers[i];link.visible=i<carCount-1;
  if(!link.visible)continue;
  trainCars[i].localToWorld(tmpA.set(0,.33,-.67));
  trainCars[i+1].localToWorld(tmpB.set(0,.33,.67));
  const between=tmpB.clone().sub(tmpA),length=between.length();
  link.position.copy(tmpA).add(tmpB).multiplyScalar(.5);
  link.scale.set(1,Math.max(.06,length),1);
  link.quaternion.setFromUnitVectors(couplerAxis,between.normalize());
 }
}

const carSpacing=1.37;
function setCarCount(n){carCount=n;trainCars.forEach((c,i)=>c.visible=i<n);document.getElementById('cars').textContent='🚃 '+n+'りょう';positionCouplers()}
// A continuous arclength-parameterized route. Quadratic rounded corners
// avoid the abrupt 90-degree rotations of the original per-tile interpolation.
const waypoints=path.map(([x,y])=>pos(x,y));
const travel=[waypoints[0].clone()];
const cornerRadius=.52,cornerSubdivisions=12;
for(let i=1;i<waypoints.length-1;i++){
 const prev=waypoints[i-1],p=waypoints[i],next=waypoints[i+1];
 const incoming=p.clone().sub(prev).normalize(),outgoing=next.clone().sub(p).normalize();
 if(incoming.distanceTo(outgoing)<.001){travel.push(p.clone());continue}
 const before=p.clone().addScaledVector(incoming,-cornerRadius),after=p.clone().addScaledVector(outgoing,cornerRadius);
 travel.push(before);
 for(let k=1;k<=cornerSubdivisions;k++){
   const t=k/cornerSubdivisions;
   travel.push(before.clone().multiplyScalar((1-t)*(1-t)).addScaledVector(p,2*(1-t)*t).addScaledVector(after,t*t));
 }
}
travel.push(waypoints[waypoints.length-1].clone());
let routePoints=[],routeLengths=[0];
const backDir=waypoints[1].clone().sub(waypoints[0]).normalize();
const forwardDir=waypoints.at(-1).clone().sub(waypoints.at(-2)).normalize();
routePoints.push(waypoints[0].clone().addScaledVector(backDir,-3.8));
routePoints.push(...travel);
routePoints.push(waypoints.at(-1).clone().addScaledVector(forwardDir,1.8));
for(let i=1;i<routePoints.length;i++)routeLengths.push(routeLengths[i-1]+routePoints[i].distanceTo(routePoints[i-1]));
let startDistance=routeLengths[1],finishDistance=routeLengths[routePoints.length-2];
function sampleRoute(distance){
 const s=Math.max(0,Math.min(routeLengths.at(-1)-.001,distance));
 let lo=0,hi=routeLengths.length-1;
 while(lo+1<hi){const m=(lo+hi)>>1;if(routeLengths[m]<=s)lo=m;else hi=m}
 const a=routePoints[lo],b=routePoints[lo+1];
 const r=(s-routeLengths[lo])/(routeLengths[lo+1]-routeLengths[lo]);
 const position=a.clone().lerp(b,r);
 // Smooth tangent over a small window so individual cars lean gently into bends.
 const pa=routePositionRaw(Math.max(0,s-.12)),pb=routePositionRaw(Math.min(routeLengths.at(-1),s+.12));
 const tangent=pb.sub(pa).normalize();
 return {position,heading:Math.atan2(tangent.x,tangent.z)};
}
function routePositionRaw(distance){
 let s=Math.max(0,Math.min(routeLengths.at(-1),distance)),i=0;
 while(i+1<routeLengths.length-1&&routeLengths[i+1]<s)i++;
 const r=(s-routeLengths[i])/(routeLengths[i+1]-routeLengths[i]);
 return routePoints[i].clone().lerp(routePoints[i+1],r);
}
let distanceTravelled=0;
function positionAllCars(){
 for(let i=0;i<trainCars.length;i++){
  const car=trainCars[i];if(i>=carCount)continue;
  const {position,heading}=sampleRoute(startDistance+distanceTravelled-i*carSpacing);
  car.position.copy(position);car.position.y=.20;
  car.rotation.y=heading;
  // Sample the route below each bogie pivot, not only at the car center.
  // Angle subtraction gives a steering angle relative to this car body.
  for(const bogie of bogiesByCar[i]){
   const sample=sampleRoute(startDistance+distanceTravelled-i*carSpacing+bogie.offset);
   let relative=sample.heading-heading;
   relative=Math.atan2(Math.sin(relative),Math.cos(relative));
   bogie.group.rotation.y=THREE.MathUtils.clamp(relative,-.65,.65);
  }
 }
 positionCouplers();
}
function placeTrain(){distanceTravelled=0;wheelSpinners.forEach(w=>w.rotation.x=0);train.position.set(0,0,0);train.rotation.y=0;train.visible=true;positionAllCars()}
function resetPuzzleRoute(){
 routePoints=[waypoints[0].clone().addScaledVector(backDir,-3.8),...travel,waypoints.at(-1).clone().addScaledVector(forwardDir,1.8)];
 rebuildDistances();startDistance=routeLengths[1];finishDistance=routeLengths[routePoints.length-2];
}
function rebuildDistances(){routeLengths=[0];for(let i=1;i<routePoints.length;i++)routeLengths.push(routeLengths.at(-1)+routePoints[i].distanceTo(routePoints[i-1]));}
function newPuzzle(){playing=false;ready=false;resetPuzzleRoute();placeTrain();for(const t of tiles.values()){t.step=Math.floor(Math.random()*4);t.rail.rotation.y=-t.step*Math.PI/2}msg.textContent='🚃 あたらしい でんしゃで しゅっぱつしよう！'}
function conNow(t){return t.con.map(d=>(d+t.step)%4)}
function valid(){for(let i=0;i<path.length-1;i++){const [x,y]=path[i],[a,b]=path[i+1],d=dir.findIndex(([dx,dy])=>dx===a-x&&dy===b-y);if(!conNow(tiles.get(key(x,y))).includes(d)||!conNow(tiles.get(key(a,b))).includes((d+2)%4))return false}return true}

// Ver.0.9: free-build mode. Connectivity is checked in both directions.
// The path finder also tracks entry directions, so a junction cannot teleport
// a train from a disconnected edge to another piece.
const freeTracks=new Map(),freeDecor=new Map();
const freeShapes={straight:[0,2],curve:[0,1],branch:[0,1,3]};
const startKey=key(0,2),goalKey=key(6,2);
const opposite=d=>(d+2)%4;
function freeCon(t){return t.con.map(d=>(d+t.step)%4)}
function clearFreeVisual(){for(const k of [...freeDecor.keys()])removeFreeDecor(k);for(const t of freeTracks.values()){scene.remove(t.rail);t.rail.traverse(o=>{if(o.geometry)o.geometry.dispose()})}freeTracks.clear()}
function removeFreeDecor(k){const item=freeDecor.get(k);if(!item)return;scene.remove(item.group);item.group.traverse(o=>{if(o.geometry)o.geometry.dispose()});freeDecor.delete(k)}
function placeFreeDecor(x,y,type){
 const k=key(x,y);removeFreeDecor(k);
 const group=new THREE.Group();if(type==='station')group.position.copy(pos(x,y));scene.add(group);
 const model=(type==='bridge')?addBridge(x,y,group):(type==='tunnel')?addTunnel(x,y,group):station(x,y,mats.yellow,group);
 const item={group,model,type};freeDecor.set(k,item);syncFreeDecor(k);
}
function syncFreeDecor(k){const decoItem=freeDecor.get(k),t=freeTracks.get(k);if(!decoItem||!t)return;
 // Align bridge and tunnel openings to the line of track.
 if(decoItem.type!=='station'){
  const c=freeCon(t);const horizontal=(c.includes(1)&&c.includes(3))||(c.includes(1)&&!c.includes(0)&&!c.includes(2));
  decoItem.model.rotation.y=horizontal?Math.PI/2:0;
 }
}
function addFreeTile(x,y,shape,step=0){
 const k=key(x,y);if(freeTracks.has(k))removeFreeTile(k);
 const con=[...freeShapes[shape]],rail=new THREE.Group(),p=pos(x,y);
 rail.position.set(p.x,.08,p.z);scene.add(rail);
 // Branch draws each arm; every rail endpoint terminates at the same center.
 if(con.length===3){for(const d of con)makeTrack(rail,[new THREE.Vector3(0,0,0),edge(d)]);}
 else makeTrack(rail,tileRailPoints(con));
 const t={x,y,shape,con,step,rail};rail.rotation.y=-step*Math.PI/2;freeTracks.set(k,t);
}
function removeFreeTile(k){removeFreeDecor(k);const t=freeTracks.get(k);if(!t)return;scene.remove(t.rail);t.rail.traverse(o=>{if(o.geometry)o.geometry.dispose()});freeTracks.delete(k)}
function updateRunButton(){document.getElementById('run').textContent=playing?'🚃 はしってる！':'🚃 はっしゃ！'}
function selectTool(tool){selectedTool=tool;document.querySelectorAll('#tools button').forEach(b=>b.classList.toggle('active',b.dataset.tool===tool))}
function setMode(mode){
 playing=false;gameMode=mode;document.body.classList.toggle('free',mode==='free');
 document.getElementById('puzzleMode').classList.toggle('active',mode==='puzzle');
 document.getElementById('freeMode').classList.toggle('active',mode==='free');
 document.getElementById('reset').textContent=mode==='free'?'🧹 けす':'🔀 まぜる';
 for(const t of tiles.values())t.rail.visible=mode==='puzzle';
 for(const t of freeTracks.values())t.rail.visible=mode==='free';
 deco.visible=mode==='puzzle';puzzleGoalStation.visible=mode==='puzzle';freeGoalStation.visible=mode==='free';
 updateRunButton();
 if(mode==='free'){resetFree();}else{newPuzzle();document.getElementById('hint').innerHTML='👆 タップ：せんろを回す<br>☝️ スライド：カメラを回す　✌️ 2本指：拡大・縮小'}
}
function resetFree(){
 playing=false;clearFreeVisual();
 // Start connects south (the approach line) and east; goal faces west.
 addFreeTile(0,2,'curve',1); // base [N,E] -> [E,S]
 addFreeTile(6,2,'straight',1); // [E,W], goal station face west
 // A very short example track shows how building works; leave gaps to fill.
 addFreeTile(1,2,'straight',1);
 for(const t of freeTracks.values())t.rail.visible=true;
 resetPuzzleRoute();placeTrain();updateRunButton();
 document.getElementById('hint').innerHTML='7×7 の ひろい せかい！<br>🛤️ せんろ・🚉えき・🌉はし・⛰️トンネルをおこう<br>☝️ スライド：カメラ　✌️ 2本指：ズーム';
 msg.textContent='🛠️ 7×7マスに せんろと まちを つくろう！';
}
function editFreeTile(k){
 if(playing)return;
 if(k===startKey||k===goalKey){msg.textContent='🚉 えきの せんろは そのままに しよう！';return}
 const [x,y]=k.split(',').map(Number),old=freeTracks.get(k);
 if(selectedTool==='erase'){removeFreeTile(k);msg.textContent='✕ せんろを けしたよ';}
 else if(selectedTool==='rotate'){
  if(!old){msg.textContent='せんろを おいてから まわそう！';return}
  old.step=(old.step+1)%4;old.rail.rotation.y=-old.step*Math.PI/2;syncFreeDecor(k);msg.textContent='↻ せんろを まわしたよ';
 }else if(['station','bridge','tunnel'].includes(selectedTool)){
  if(!old)addFreeTile(x,y,'straight');
  placeFreeDecor(x,y,selectedTool);
  msg.textContent=selectedTool==='station'?'🚉 あたらしい えきが できたよ！':selectedTool==='bridge'?'🌉 はしが できたよ！':'⛰️ トンネルが できたよ！';
 }else{addFreeTile(x,y,selectedTool);msg.textContent='🛤️ せんろを おいたよ！';}
 // Update the train preview after every edit to keep it at the starting station.
 resetPuzzleRoute();placeTrain();
 const route=findFreeRoute();if(route)msg.textContent='✨ えきまで つながった！ はっしゃ できるよ！';
}
function findFreeRoute(){
 const start=freeTracks.get(startKey),goal=freeTracks.get(goalKey);
 if(!start||!goal||!freeCon(start).includes(2))return null;
 const queue=[{k:startKey,entry:2,steps:[]}],visited=new Set([startKey+':2']);
 for(let qi=0;qi<queue.length;qi++){
  const state=queue[qi],t=freeTracks.get(state.k);if(!t)continue;
  const exits=freeCon(t).filter(d=>d!==state.entry);
  if(state.k===goalKey){if(state.entry===3)return [...state.steps,{k:state.k,entry:state.entry,exit:1}];continue}
  for(const out of exits){
   const [dx,dy]=dir[out],nk=key(t.x+dx,t.y+dy),nt=freeTracks.get(nk),incoming=opposite(out);
   if(!nt||!freeCon(nt).includes(incoming))continue;
   if(nk===startKey)continue;
   const stateKey=nk+':'+incoming;if(visited.has(stateKey))continue;
   visited.add(stateKey);
   queue.push({k:nk,entry:incoming,steps:[...state.steps,{k:state.k,entry:state.entry,exit:out}]});
  }
 }
 return null;
}
function installFreeRoute(steps){
 const points=[],stationPos=pos(0,2);
 // The approach rail extends south from the start tile.
 points.push(stationPos.clone().addScaledVector(vecDir(2),3.8));
 for(const st of steps){
  const t=freeTracks.get(st.k),center=pos(t.x,t.y);
  let local;
  if(st.k===goalKey){local=[edge(st.entry),new THREE.Vector3(0,0,0)];}
  else{local=tileRailPoints([st.entry,st.exit]);}
  for(const lp of local){
   const point=center.clone().add(lp);point.y=0;
   if(!points.length||points.at(-1).distanceTo(point)>.002)points.push(point);
  }
 }
 const finish=points.at(-1).clone();
 // A small terminus extension accommodates the head of the train.
 points.push(finish.clone().addScaledVector(vecDir(1),.25));
 routePoints=points;rebuildDistances();
 startDistance=3.8;finishDistance=routeLengths[routeLengths.length-2];
}
document.getElementById('puzzleMode').onclick=()=>setMode('puzzle');
document.getElementById('freeMode').onclick=()=>setMode('free');
document.querySelectorAll('#tools button').forEach(b=>b.addEventListener('click',()=>selectTool(b.dataset.tool)));
selectTool('straight');

// Ver.0.3: one finger rotates orbit camera, two fingers pinch to zoom.
// Single taps still rotate track tiles. Pointer capture prevents touch loss.
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();
const cameraTarget=new THREE.Vector3(0,.22,0);
const orbit={theta:.53,phi:.77,distance:27};
const orbitLimits={minDist:9,maxDist:42,minPhi:.23,maxPhi:1.33};
const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
function applyOrbit(){
 const s=Math.sin(orbit.phi);
 camera.position.set(cameraTarget.x+orbit.distance*s*Math.sin(orbit.theta),cameraTarget.y+orbit.distance*Math.cos(orbit.phi),cameraTarget.z+orbit.distance*s*Math.cos(orbit.theta));
 camera.lookAt(cameraTarget);
}
function cameraHome(){orbit.theta=.53;orbit.phi=.77;orbit.distance=27;applyOrbit()}
function cameraZoom(factor){orbit.distance=clamp(orbit.distance*factor,orbitLimits.minDist,orbitLimits.maxDist);applyOrbit()}
const activePointers=new Map();let gestureMoved=false,pinchDist=0,pinchDistanceBefore=orbit.distance;
let singleStart=null;
function pointerDistance(){const a=[...activePointers.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}
const canvas=renderer.domElement;
canvas.style.touchAction='none';
canvas.addEventListener('pointerdown',e=>{
 if(e.button!==0&&e.pointerType==='mouse')return;
 canvas.setPointerCapture(e.pointerId);
 activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(activePointers.size===1){singleStart={id:e.pointerId,x:e.clientX,y:e.clientY};gestureMoved=false}
 else{gestureMoved=true;singleStart=null;if(activePointers.size===2){pinchDist=pointerDistance();pinchDistanceBefore=orbit.distance}}
});
canvas.addEventListener('pointermove',e=>{
 const prev=activePointers.get(e.pointerId);if(!prev)return;
 const dx=e.clientX-prev.x,dy=e.clientY-prev.y;
 activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(activePointers.size===1){
  if(singleStart&&Math.hypot(e.clientX-singleStart.x,e.clientY-singleStart.y)>9)gestureMoved=true;
  if(gestureMoved){orbit.theta-=dx*.008;orbit.phi=clamp(orbit.phi-dy*.008,orbitLimits.minPhi,orbitLimits.maxPhi);applyOrbit()}
 }else if(activePointers.size===2){
  const current=pointerDistance();if(pinchDist>1&&current>1){orbit.distance=clamp(pinchDistanceBefore*pinchDist/current,orbitLimits.minDist,orbitLimits.maxDist);applyOrbit()}
 }
});
function handlePointerEnd(e,cancelled){
 const wasDown=activePointers.has(e.pointerId),tap=wasDown&&!cancelled&&activePointers.size===1&&!gestureMoved&&singleStart?.id===e.pointerId&&Math.hypot(e.clientX-singleStart.x,e.clientY-singleStart.y)<13;
 activePointers.delete(e.pointerId);
 if(activePointers.size===1){singleStart=null;gestureMoved=true} // don't spin rails after pinch
 if(activePointers.size===0){singleStart=null;gestureMoved=false}
 if(!tap||playing)return;
 const rect=canvas.getBoundingClientRect();
 pointer.set((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);
 ray.setFromCamera(pointer,camera);const hit=ray.intersectObjects(clickable)[0];if(!hit)return;
 const cell=hit.object.userData.tileKey;
 if(gameMode==='free'){editFreeTile(cell);return;}
 const t=tiles.get(cell);if(!t)return;
 t.step=(t.step+1)%4;t.rail.rotation.y=-t.step*Math.PI/2;
 msg.textContent=valid()?'✨ つながった！ はっしゃボタンを おそう！':'せんろを タッチして まわそう！';
}
canvas.addEventListener('pointerup',e=>handlePointerEnd(e,false));
canvas.addEventListener('pointercancel',e=>handlePointerEnd(e,true));
canvas.addEventListener('wheel',e=>{e.preventDefault();cameraZoom(Math.exp(e.deltaY*.001))},{passive:false});
document.getElementById('zoomIn').onclick=()=>cameraZoom(.82);
document.getElementById('zoomOut').onclick=()=>cameraZoom(1.22);
document.getElementById('cameraReset').onclick=cameraHome;
document.getElementById('reset').onclick=()=>gameMode==='free'?resetFree():newPuzzle();
document.getElementById('cars').onclick=()=>{if(playing)return;setCarCount(carCount===3?2:3);positionAllCars();msg.textContent='🚃 '+carCount+'りょう へんせいに したよ！'};
document.getElementById('run').onclick=()=>{
 if(playing)return;
 if(gameMode==='free'){
  const selected=findFreeRoute();if(!selected){msg.textContent='⚠️ ふたつの えきを せんろで つなごう！';return}
  installFreeRoute(selected);
 }else if(!valid()){msg.textContent='⚠️ せんろが まだ つながっていないよ！';return}
 placeTrain();elapsed=0;distanceTravelled=0;playing=true;updateRunButton();msg.textContent='🚃 '+carCount+'りょうで しゅっぱつ しんこう！';
};
function resize(){camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<innerHeight?49:39;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);applyOrbit()}window.addEventListener('resize',resize);cameraHome();resize();setCarCount(3);newPuzzle();
let prev=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-prev)/1000,.05);prev=now;for(const l of crossingLights){l.mesh.material=(playing&&Math.abs(elapsed-5)<1.4&&Math.floor(now/320)%2===0)?signalRed:signalOff}if(playing){elapsed+=dt;const advance=dt*1.7;distanceTravelled+=advance;for(const wheel of wheelSpinners)wheel.rotation.x-=advance/.135;positionAllCars();if(startDistance+distanceTravelled>=finishDistance+(carCount-1)*carSpacing){playing=false;updateRunButton();msg.textContent='🎉 '+carCount+'りょう ぜんぶ とうちゃく！'}}renderer.render(scene,camera)}requestAnimationFrame(animate);
