<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#d9f3ff"><title>あおの3Dおとどけでんしゃ Ver.0.3</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;background:#c6ebff;touch-action:none}#world{position:fixed;inset:0}#ui{position:fixed;top:env(safe-area-inset-top);left:0;right:0;display:flex;align-items:center;justify-content:center;padding:9px 12px;pointer-events:none}#title{background:#fffef5eb;border-radius:18px;padding:9px 14px;font-weight:900;color:#194461;box-shadow:0 4px 12px #29536522;text-align:center;font-size:clamp(14px,4vw,20px)}#msg{position:fixed;top:calc(env(safe-area-inset-top) + 62px);left:12px;right:12px;text-align:center;font-weight:800;color:#22526b;text-shadow:0 1px 2px white;pointer-events:none;font-size:clamp(13px,3.7vw,17px)}#bottom{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 14px);left:10px;right:10px;display:flex;gap:9px;justify-content:center}button{border:0;border-radius:18px;font-size:17px;font-weight:900;padding:15px 16px;background:#fff;box-shadow:0 5px 0 #b5c5ca;color:#204a60;touch-action:manipulation}#run{background:#ffcc45;box-shadow:0 5px 0 #d49a19;flex:1;max-width:230px}#reset{flex:0 0 auto}#cameraControls{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 98px);display:flex;flex-direction:column;gap:8px;z-index:2}#cameraControls button{font-size:21px;padding:10px 12px;min-width:46px;min-height:46px;background:#fffffff0;border:1px solid #c8e1e5;box-shadow:0 3px 0 #b5c5ca}#hint{position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom) + 84px);background:#ffffffdb;color:#24516b;font-size:12px;font-weight:800;border-radius:12px;padding:8px 10px;pointer-events:none;line-height:1.5;max-width:min(80vw,320px)}button:active{transform:translateY(3px);box-shadow:0 2px 0 #b5c5ca}#features{position:fixed;top:calc(env(safe-area-inset-top) + 94px);left:10px;background:#ffffffd9;border-radius:12px;padding:7px 9px;font-size:12px;font-weight:800;color:#205165;box-shadow:0 3px 12px #33556622;pointer-events:none}#error{display:none;position:fixed;inset:20%;background:white;color:#ad2020;padding:20px;border-radius:15px;z-index:3}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js"}}</script>
</head>
<body><div id="world"></div><div id="ui"><div id="title">🚃 あおの 3D おとどけでんしゃ</div></div><div id="msg">せんろを タッチして つなげよう！</div><div id="features">🌉 はし　⛰️ トンネル　🚦 ふみきり</div><div id="cameraControls"><button id="zoomIn" aria-label="カメラを拡大">＋</button><button id="zoomOut" aria-label="カメラを縮小">－</button><button id="cameraReset" aria-label="カメラの位置を元に戻す">⌂</button></div><div id="hint">👆 タップ：せんろを回す<br>☝️ スライド：カメラを回す　✌️ 2本指：拡大・縮小</div><div id="bottom"><button id="reset">🔀 まぜる</button><button id="run">🚃 はっしゃ！</button></div><div id="error"></div>
<script type="module">
import * as THREE from 'three';
const root=document.getElementById('world'),msg=document.getElementById('msg');
const scene=new THREE.Scene();scene.background=new THREE.Color(0xc5eaff);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x83b16f,2.4));const sun=new THREE.DirectionalLight(0xffffff,2.1);sun.position.set(-4,12,9);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-12;sun.shadow.camera.right=12;sun.shadow.camera.top=12;sun.shadow.camera.bottom=-12;scene.add(sun);
const mats={grass:new THREE.MeshStandardMaterial({color:0x8cce80}),tile:new THREE.MeshStandardMaterial({color:0xb3dba0}),wood:new THREE.MeshStandardMaterial({color:0x8c6243}),metal:new THREE.MeshStandardMaterial({color:0xd8e1eb,metalness:.55,roughness:.36}),red:new THREE.MeshStandardMaterial({color:0xe94242}),white:new THREE.MeshStandardMaterial({color:0xfaf9e6}),black:new THREE.MeshStandardMaterial({color:0x303a41}),yellow:new THREE.MeshStandardMaterial({color:0xffd344}),blue:new THREE.MeshStandardMaterial({color:0x338cc9}),roof:new THREE.MeshStandardMaterial({color:0xe75b43}),window:new THREE.MeshStandardMaterial({color:0x97e5fa,metalness:.1,roughness:.2})};
function cube(parent,w,h,d,mat,x=0,y=0,z=0){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function cylinder(parent,r,h,mat,x,y,z){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,16),mat);m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m}
const ground=cube(scene,12,.4,12,mats.grass,0,-.27,0);
// Board coordinates: columns left-to-right, rows top-to-bottom.
const path=[[0,2],[0,1],[1,1],[2,1],[2,2],[3,2],[3,3],[4,3],[4,2]];
const dir=[[0,-1],[1,0],[0,1],[-1,0]]; // N E S W
const key=(x,y)=>x+','+y;
const pathMap=new Map(path.map((p,i)=>[key(...p),i]));
const tiles=new Map(), clickable=[];let playing=false,elapsed=0,ready=false;
function pos(x,y){return new THREE.Vector3((x-2)*1.65,0,(y-2)*1.65)}
function connectionsAt(i){const [x,y]=path[i],arr=[];if(i>0){const [a,b]=path[i-1];arr.push(dir.findIndex(([dx,dy])=>dx===a-x&&dy===b-y))}if(i<path.length-1){const [a,b]=path[i+1];arr.push(dir.findIndex(([dx,dy])=>dx===a-x&&dy===b-y))}return arr}
function segment(parent,angle){const arm=new THREE.Group();arm.rotation.y=-angle*Math.PI/2;parent.add(arm);for(const x of [-.22,.22])cube(arm,.075,.065,.86,mats.metal,x,.27,-.40);for(const z of [-.17,-.40,-.65])cube(arm,.78,.08,.15,mats.wood,0,.20,z)}
for(let y=0;y<5;y++)for(let x=0;x<5;x++){
 const p=pos(x,y),idx=pathMap.get(key(x,y));const base=cube(scene,1.55,.16,1.55,idx===undefined?mats.tile:mats.white,p.x,.01,p.z);base.userData.tileKey=idx===undefined?null:key(x,y);if(idx===undefined)continue;
 const rail=new THREE.Group();rail.position.set(p.x,.08,p.z);scene.add(rail);
 const con=connectionsAt(idx);con.forEach(d=>segment(rail,d));tiles.set(key(x,y),{x,y,rail,con,step:0,idx});clickable.push(base);
}
// Decorative river and bridge-like water patches, trees and small houses, away from path.
const water=new THREE.MeshStandardMaterial({color:0x53bee3,roughness:.28,transparent:true,opacity:.82});
for(const [x,y] of [[1,3],[2,3],[1,4],[2,4]]){const p=pos(x,y);cube(scene,1.40,.025,1.35,water,p.x,.115,p.z)}
for(const [x,y] of [[4,0],[3,0],[1,0],[0,4]]){const p=pos(x,y);cylinder(scene,.13,.7,mats.wood,p.x,.55,p.z);const leaves=new THREE.Mesh(new THREE.ConeGeometry(.47,1.15,7),new THREE.MeshStandardMaterial({color:0x268d54}));leaves.position.set(p.x,1.4,p.z);leaves.castShadow=true;scene.add(leaves)}

// Ver.0.3: bridges, tunnel, crossing. Decorative meshes never enter clickable list.
const stone=new THREE.MeshStandardMaterial({color:0x929a9d,roughness:.84});
const mountain=new THREE.MeshStandardMaterial({color:0x72a06b,roughness:1});
const darkTunnel=new THREE.MeshStandardMaterial({color:0x283c41,roughness:1});
const roadMat=new THREE.MeshStandardMaterial({color:0x606b70,roughness:1});
const lineMat=new THREE.MeshStandardMaterial({color:0xfff7dc});
const warningMat=new THREE.MeshStandardMaterial({color:0xffbc25});
const signalRed=new THREE.MeshStandardMaterial({color:0xe93238,emissive:0x4e0000});
const signalOff=new THREE.MeshStandardMaterial({color:0x512f32});
const deco=new THREE.Group();scene.add(deco);
function addBridge(x,y){
 const p=pos(x,y),g=new THREE.Group();g.position.copy(p);deco.add(g);
 // Water below rail and stone foundation along both sides of the track.
 cube(g,1.49,.035,1.48,water,0,.12,0);
 cube(g,1.22,.13,1.22,stone,0,.19,0);
 // Low bridge guardrails: do not obscure the touch target or train.
 for(const side of [-1,1]){
   cube(g,.075,.34,1.23,mats.white,side*.67,.43,0);
   for(const z of [-.48,0,.48])cube(g,.12,.42,.12,stone,side*.67,.33,z);
 }
 for(const z of [-.68,.68])cube(g,1.35,.13,.16,stone,0,.18,z);
}
addBridge(2,2);
function addTunnel(x,y){
 const p=pos(x,y),g=new THREE.Group();g.position.copy(p);deco.add(g);
 // A simple open portal arch (back side remains visible).
 const passage=1.12;
 for(const x of [-.67,.67]){
   cube(g,.30,1.12,1.24,mountain,x,.71,0);
   cube(g,.24,.23,1.31,stone,x,.40,0);
 }
 cube(g,1.64,.35,1.29,mountain,0,1.39,0);
 // Mountain crown above the portal.
 const peak=new THREE.Mesh(new THREE.ConeGeometry(1.10,.79,5),mountain);
 peak.position.set(0,1.89,0);peak.castShadow=true;g.add(peak);
 for(const z of [-.65,.65]){
   cube(g,.30,.94,.08,stone,-.68,.76,z);
   cube(g,.30,.94,.08,stone,.68,.76,z);
   cube(g,1.62,.22,.08,stone,0,1.34,z);
 }
}
addTunnel(3,3);
const crossingLights=[];
function addCrossing(x,y){
 const p=pos(x,y),g=new THREE.Group();g.position.copy(p);deco.add(g);
 cube(g,1.42,.025,1.46,roadMat,0,.13,0);
 for(const z of [-.59,.59])cube(g,.08,.028,.25,lineMat,0,.155,z);
 for(const side of [-1,1]){
   const poleX=side*.66;
   cube(g,.09,.78,.09,mats.black,poleX,.56,.0);
   cube(g,.17,.17,.12,signalRed,poleX,.92,0);
   crossingLights.push({x,y,mesh:g.children[g.children.length-1]});
   const arm=new THREE.Group();arm.position.set(poleX,.73,0);g.add(arm);
   const barrier=cube(arm,.10,.10,.72,warningMat,0,0,side*.37);
   for(const zz of [-.20,.12])cube(arm,.11,.105,.11,mats.black,0,.004,side*.37+zz);
 }
}
addCrossing(3,2);

function station(x,y,color){const p=pos(x,y);cube(scene,.83,.63,.60,color,p.x,.48,p.z+.58);cube(scene,1.10,.16,.85,mats.roof,p.x,.87,p.z+.58);cube(scene,.23,.33,.06,mats.window,p.x-.22,.52,p.z+.267);cube(scene,.23,.33,.06,mats.window,p.x+.22,.52,p.z+.267)}
station(0,2,mats.yellow);station(4,2,mats.blue);
// Train model faces +Z in local coordinates.
const train=new THREE.Group();scene.add(train);cube(train,.72,.50,1.02,mats.red,0,.61,0);cube(train,.76,.16,1.03,mats.white,0,.93,0);cube(train,.56,.24,.055,mats.window,0,.72,.515);cube(train,.52,.20,.055,mats.window,0,.73,-.515);for(const x of [-.32,.32])for(const z of [-.33,.33]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.09,16),mats.black);wheel.rotation.z=Math.PI/2;wheel.position.set(x,.33,z);train.add(wheel)}cube(train,.24,.10,.08,mats.yellow,0,.47,.54);
function placeTrain(){const p=pos(...path[0]);train.position.set(p.x,.12,p.z);train.rotation.y=Math.PI;train.visible=true}
function newPuzzle(){playing=false;ready=false;placeTrain();for(const t of tiles.values()){t.step=Math.floor(Math.random()*4);t.rail.rotation.y=-t.step*Math.PI/2}msg.textContent='🌉 はし・⛰️ トンネル・🚦 ふみきりを とおろう！'}
function conNow(t){return t.con.map(d=>(d+t.step)%4)}
function valid(){for(let i=0;i<path.length-1;i++){const [x,y]=path[i],[a,b]=path[i+1],d=dir.findIndex(([dx,dy])=>dx===a-x&&dy===b-y);if(!conNow(tiles.get(key(x,y))).includes(d)||!conNow(tiles.get(key(a,b))).includes((d+2)%4))return false}return true}
// Ver.0.3: one finger rotates orbit camera, two fingers pinch to zoom.
// Single taps still rotate track tiles. Pointer capture prevents touch loss.
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();
const cameraTarget=new THREE.Vector3(0,.22,0);
const orbit={theta:.53,phi:.77,distance:24};
const orbitLimits={minDist:10,maxDist:34,minPhi:.23,maxPhi:1.33};
const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
function applyOrbit(){
 const s=Math.sin(orbit.phi);
 camera.position.set(cameraTarget.x+orbit.distance*s*Math.sin(orbit.theta),cameraTarget.y+orbit.distance*Math.cos(orbit.phi),cameraTarget.z+orbit.distance*s*Math.cos(orbit.theta));
 camera.lookAt(cameraTarget);
}
function cameraHome(){orbit.theta=.53;orbit.phi=.77;orbit.distance=24;applyOrbit()}
function cameraZoom(factor){orbit.distance=clamp(orbit.distance*factor,orbitLimits.minDist,orbitLimits.maxDist);applyOrbit()}
const activePointers=new Map();let gestureMoved=false,pinchDist=0,pinchDistanceBefore=orbit.distance;
let singleStart=null;
function pointerDistance(){const a=[...activePointers.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}
const canvas=renderer.domElement;
canvas.style.touchAction='none';
canvas.addEventListener('pointerdown',e=>{
 if(e.button!==0&&e.pointerType==='mouse')return;
 canvas.setPointerCapture(e.pointerId);
 activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(activePointers.size===1){singleStart={id:e.pointerId,x:e.clientX,y:e.clientY};gestureMoved=false}
 else{gestureMoved=true;singleStart=null;if(activePointers.size===2){pinchDist=pointerDistance();pinchDistanceBefore=orbit.distance}}
});
canvas.addEventListener('pointermove',e=>{
 const prev=activePointers.get(e.pointerId);if(!prev)return;
 const dx=e.clientX-prev.x,dy=e.clientY-prev.y;
 activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(activePointers.size===1){
  if(singleStart&&Math.hypot(e.clientX-singleStart.x,e.clientY-singleStart.y)>9)gestureMoved=true;
  if(gestureMoved){orbit.theta-=dx*.008;orbit.phi=clamp(orbit.phi-dy*.008,orbitLimits.minPhi,orbitLimits.maxPhi);applyOrbit()}
 }else if(activePointers.size===2){
  const current=pointerDistance();if(pinchDist>1&&current>1){orbit.distance=clamp(pinchDistanceBefore*pinchDist/current,orbitLimits.minDist,orbitLimits.maxDist);applyOrbit()}
 }
});
function handlePointerEnd(e,cancelled){
 const wasDown=activePointers.has(e.pointerId),tap=wasDown&&!cancelled&&activePointers.size===1&&!gestureMoved&&singleStart?.id===e.pointerId&&Math.hypot(e.clientX-singleStart.x,e.clientY-singleStart.y)<13;
 activePointers.delete(e.pointerId);
 if(activePointers.size===1){singleStart=null;gestureMoved=true} // don't spin rails after pinch
 if(activePointers.size===0){singleStart=null;gestureMoved=false}
 if(!tap||playing)return;
 const rect=canvas.getBoundingClientRect();
 pointer.set((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);
 ray.setFromCamera(pointer,camera);const hit=ray.intersectObjects(clickable)[0];if(!hit)return;
 const t=tiles.get(hit.object.userData.tileKey);if(!t)return;
 t.step=(t.step+1)%4;t.rail.rotation.y=-t.step*Math.PI/2;
 msg.textContent=valid()?'✨ つながった！ はっしゃボタンをおそう！':'せんろを タッチして まわそう！';
}
canvas.addEventListener('pointerup',e=>handlePointerEnd(e,false));
canvas.addEventListener('pointercancel',e=>handlePointerEnd(e,true));
canvas.addEventListener('wheel',e=>{e.preventDefault();cameraZoom(Math.exp(e.deltaY*.001))},{passive:false});
document.getElementById('zoomIn').onclick=()=>cameraZoom(.82);
document.getElementById('zoomOut').onclick=()=>cameraZoom(1.22);
document.getElementById('cameraReset').onclick=cameraHome;
document.getElementById('reset').onclick=newPuzzle;
document.getElementById('run').onclick=()=>{if(playing)return;if(!valid()){msg.textContent='⚠️ せんろが まだ つながっていないよ！';return}elapsed=0;playing=true;msg.textContent='🚃 しゅっぱつ しんこう！'};
function resize(){camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<innerHeight?49:39;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);applyOrbit()}window.addEventListener('resize',resize);cameraHome();resize();newPuzzle();
let prev=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-prev)/1000,.05);prev=now;for(const l of crossingLights){l.mesh.material=(playing&&Math.abs(elapsed-5)<1.4&&Math.floor(now/320)%2===0)?signalRed:signalOff}if(playing){elapsed+=dt*1.15;const i=Math.min(path.length-2,Math.floor(elapsed));const a=pos(...path[i]),b=pos(...path[i+1]);const t=Math.min(1,elapsed-i);train.position.lerpVectors(a,b,t);train.position.y=.12;train.rotation.y=Math.atan2(b.x-a.x,b.z-a.z);if(elapsed>=path.length-1){playing=false;msg.textContent='🎉 やったね！ えきに とうちゃく！'}}renderer.render(scene,camera)}requestAnimationFrame(animate);
</script></body></html>
