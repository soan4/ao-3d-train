const ground=cube(scene,13.7,.4,13.7,mats.grass,0,-.27,0);
// Board coordinates: columns left-to-right, rows top-to-bottom.
const path=[[0,2],[0,1],[1,1],[2,1],[2,2],[3,2],[3,3],[4,3],[4,2]];
const dir=[[0,-1],[1,0],[0,1],[-1,0]]; // N E S W

const tiles=new Map(), clickable=[];let playing=false,elapsed=0,ready=false;let driveGear=1;let currentSpeed=0;let gameMode="puzzle",selectedTool="straight";
function pos(x,y){return new THREE.Vector3((x-3)*1.65,0,(y-3)*1.65)}

const railSteel=new THREE.MeshStandardMaterial({color:0xb8c9d5,metalness:.72,roughness:.27});
const sleeperMat=new THREE.MeshStandardMaterial({color:0x75513a,roughness:.92});

const railGauge=.81,halfTile=.825,curveRadius=.52;
function edge(d){return new THREE.Vector3(dir[d][0]*halfTile,0,dir[d][1]*halfTile)}

function tileRailPoints(con){
 if(con.length===1){const d=con[0];return [new THREE.Vector3(0,0,0),edge(d).clone()];}
 const a=con[0],b=con[1];
 const eA=edge(a),eB=edge(b),uA=vecDir(a),uB=vecDir(b);
 if((a+2)%4===b)return [eA,eB];

function makeTrack(parent,positions){
 // The same sampled centerline is used for both steel rails and timber sleepers.
 // Everything belongs to the rotating tile group, including curved sleepers.
 const fine=[];
 for(let i=0;i<positions.length-1;i++){
  const a=positions[i],b=positions[i+1],n=Math.max(1,Math.ceil(a.distanceTo(b)/.07));

 }
 fine.push(positions.at(-1).clone());
 const arc=[0];for(let i=1;i<fine.length;i++)arc.push(arc.at(-1)+fine[i].distanceTo(fine[i-1]));

 pointer.set((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);
 ray.setFromCamera(pointer,camera);const hit=ray.intersectObjects(clickable)[0];if(!hit)return;
 const cell=hit.object.userData.tileKey;
 if(gameMode==='free'){editFreeTile(cell);return;}
 const t=tiles.get(cell);if(!t)return;
 t.step=(t.step+1)%4;t.rail.rotation.y=-t.step*Math.PI/2;
 msg.textContent=valid()?'✨ つながった！ はっしゃボタンを おそう！':'せんろを タッチして まわそう！';
}
canvas.addEventListener('pointerup',e=>handlePointerEnd(e,false));
canvas.addEventListener('pointercancel',e=>handlePointerEnd(e,true));
canvas.addEventListener('wheel',e=>{e.preventDefault();cameraZoom(Math.exp(e.deltaY*.001))},{passive:false});
document.getElementById('zoomIn').onclick=()=>cameraZoom(.82);
document.getElementById('zoomOut').onclick=()=>cameraZoom(1.22);
document.getElementById('cameraReset').onclick=cameraHome;
document.getElementById('reset').onclick=()=>gameMode==='free'?resetFree():newPuzzle();
document.getElementById('cars').onclick=()=>{if(playing)return;setCarCount(carCount===3?2:3);positionAllCars();msg.textContent='🚃 '+carCount+'りょう へんせいに したよ！'};
document.getElementById('run').onclick=()=>{
 unlockSound();
 if(playing)return;
 if(gameMode==='free'){
  const selected=findFreeRoute();if(!selected){msg.textContent='⚠️ ふたつの えきを せんろで つなごう！';return}
  installFreeRoute(selected);
 }else if(!valid()){msg.textContent='⚠️ せんろが まだ つながっていないよ！';return}
 placeTrain();elapsed=0;distanceTravelled=0;currentSpeed=0;prepareMission();playing=true;setDriveGear(1);updateRunButton();refreshSpeedDisplay();msg.textContent='🚃 '+carCount+'りょうで しゅっぱつ しんこう！';
};
function resize(){camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<innerHeight?49:39;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);applyOrbit()}window.addEventListener('resize',resize);cameraHome();resize();setCarCount(3);newPuzzle();
let prev=performance.now();function animate(now){
 requestAnimationFrame(animate);const dt=Math.min((now-prev)/1000,.05);prev=now;
 if(bannerTime>0){bannerTime-=dt;if(bannerTime<=0)bannerEl.classList.remove('show')}
 for(const l of crossingLights){l.mesh.material=(playing&&Math.abs(elapsed-5)<1.4&&Math.floor(now/320)%2===0)?signalRed:signalOff}
 if(playing){
  elapsed+=dt;
  if(missionWait>0){
   // Station dwell must continue even when the driver leaves the lever at STOP.
   currentSpeed=0;
   missionWait=Math.max(0,missionWait-dt);boardingClock+=dt;updateBoarding(boardingClock);
   if(missionWait===0){missionLoaded=true;updateMissionVisual();hideBoarding();departureBell();progressEl.textContent='③ '+(missionType==='passenger'?'🧒 おきゃくさんを のせた！':'📦 にもつを つんだ！')+' ゴールへ！';msg.textContent='🚃 ドアが しまった！ しゅっぱつ！';}
  }else{
   let target=targetSpeeds[driveGear];
   const nextStop=missionNext<missionStops.length?missionStops[missionNext].s:null;
   if(nextStop!==null){
    const remaining=Math.max(0,nextStop-(startDistance+distanceTravelled));
    // Slow down automatically before the intermediate platform.
    target=Math.min(target,Math.sqrt(2*stationBraking*remaining));
   }
   currentSpeed=approachSpeed(currentSpeed,target,dt);
   if(currentSpeed<.015)currentSpeed=0;
   let advance=currentSpeed*dt;
   if(nextStop!==null){
    const remaining=Math.max(0,nextStop-(startDistance+distanceTravelled));
    if(remaining<=Math.max(.012,advance)){
     advance=remaining;distanceTravelled+=advance;currentSpeed=0;onStationStop();
    }else distanceTravelled+=advance;
   }else distanceTravelled+=advance;
   if(advance>0){for(const wheel of wheelSpinners)wheel.rotation.x-=advance/.135;positionAllCars();}
   if(startDistance+distanceTravelled>=finishDistance+(carCount-1)*carSpacing){
    hideBoarding();playing=false;currentSpeed=0;updateRunButton();msg.textContent='🎉 '+carCount+'りょう ぜんぶ とうちゃく！';onMissionFinish();
   }
  }
  refreshSpeedDisplay();
 }
 renderer.render(scene,camera)
}requestAnimationFrame(animate);window.__aoLoaded=true;
</script></body></html>
